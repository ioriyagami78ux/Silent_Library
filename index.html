<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silent Library - Home</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { display: flex; align-items: center; background: #f4f4f4; padding: 10px; }
    header img { height: 50px; margin-right: 15px; }
    header h1 { flex: 1; text-align: center; margin: 0; }
    header input[type="text"] { padding: 5px; }

    nav { background: #333; position: relative; z-index: 1000; } /* ensure nav is above carousel */
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; }
    nav ul li { position: relative; }
    nav ul li a { display: block; padding: 10px 20px; color: white; text-decoration: none; }
    nav ul li a:hover { background: #555; }
    nav ul li ul {
      display: none;
      position: absolute;
      background: #444;
      list-style: none;
      padding: 0;
      margin: 0;
      min-width: 160px;
      z-index: 2000; /* dropdown above carousel */
    }
    nav ul li:hover ul { display: block; }
    nav ul li ul li a { padding: 10px; display: block; }

    /* Carousel aligned like book list/details */
    .carousel {
      position: relative;
      max-width: 900px;
      margin: 30px auto;
      overflow: hidden;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #000;
      z-index: 1; /* keep carousel below nav */
    }
    .carousel img {
      width: 100%;
      height: 350px;
      object-fit: contain;
      display: none;
    }
    .carousel img.active { display: block; }

    .dots { text-align: center; margin: 10px 0; }
    .dots span {
      height: 10px; width: 10px; margin: 5px;
      display: inline-block; border-radius: 50%;
      background: gray; cursor: pointer;
    }
    .dots span.active { background: blue; }

    footer { background: #222; color: white; padding: 20px; text-align: center; margin-top: 40px; }
    footer a { color: white; margin: 0 10px; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .social-icons img { height: 20px; margin: 0 5px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="https://i.ytimg.com/vi/wTk-OA6rLK4/hqdefault.jpg" alt="Corporate Logo">
    <h1>Silent Library</h1>
    <input type="text" placeholder="Search">
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li>
        <a href="#">Books</a>
        <ul>
          <li><a href="Silent_Library_Book_List">Book List</a></li>
          <li><a href="Silent_Library_Book_Details">Book Details</a></li>
        </ul>
      </li>
      <li><a href="Silent_Library_Event">Event</a></li>
      <li>
        <a href="#">About</a>
        <ul>
          <li><a href="Silent_Library_Contact_Us">Contact Us</a></li>
          <li><a href="Silent_Library_Privacy_Policy">Privacy Policy</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- Carousel -->
  <div class="carousel">
    <img src="https://m.media-amazon.com/images/I/71XqqKTZz7L._AC_UF1000,1000_QL80_.jpg" class="active" alt="Carousel 1">
    <img src="https://m.media-amazon.com/images/I/818umIdoruL._AC_UF1000,1000_QL80_.jpg" alt="Carousel 2">
    <img src="https://popular.com.sg/cdn/shop/files/download_6770a756-2135-425f-b82b-55d5fee9bfcd.jpg?v=1751009823" alt="Carousel 3">
    <img src="https://m.media-amazon.com/images/I/91-LL7OnDCL._AC_UF1000,1000_QL80_.jpg" alt="Carousel 4">
  </div>
  <div class="dots">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Footer -->
  <footer>
    <div class="social-icons">
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="X"></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
      <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
    </div>
    <p>
      <a href="index.html">Home</a> | 
      <a href="Silent_Library_Book_List">Book List</a> | 
      <a href="Silent_Library_Book_Details">Book Details</a> | 
      <a href="Silent_Library_Event">Events</a> | 
      <a href="Silent_Library_Contact_Us">Contact Us</a> | 
      <a href="Silent_Library_Privacy_Policy">Privacy Policy</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeC2oIjsJanyNnGL0hyd7fGJR3vdXnDeMYZ2xVMfWcoTCfL9A/viewform?usp=dialog" target="_blank">Feedback</a>
    </p>
  </footer>

  <!-- Carousel Script -->
  <script>
    const images = document.querySelectorAll('.carousel img');
    const dots = document.querySelectorAll('.dots span');
    let index = 0;

    function showSlide(i) {
      images.forEach((img, idx) => img.classList.toggle('active', idx === i));
      dots.forEach((dot, idx) => dot.classList.toggle('active', idx === i));
    }

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        index = i;
        showSlide(index);
      });
    });

    setInterval(() => {
      index = (index + 1) % images.length;
      showSlide(index);
    }, 3000);
  </script>

</body>
</html>
