<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silent Library - Events</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { display: flex; align-items: center; background: #f4f4f4; padding: 10px; }
    header img { height: 50px; margin-right: 15px; }
    header h1 { flex: 1; text-align: center; margin: 0; }
    header input[type="text"] { padding: 5px; }

    nav { background: #333; position: relative; z-index: 1000; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; }
    nav ul li { position: relative; white-space: nowrap; }
    nav ul li a { display: block; padding: 10px 20px; color: white; text-decoration: none; }
    nav ul li a:hover { background: #555; }
    nav ul li ul {
      display: none;
      position: absolute;
      background: #444;
      list-style: none;
      padding: 0;
      margin: 0;
      min-width: 160px;
      z-index: 2000;
    }
    nav ul li:hover ul { display: block; }
    nav ul li ul li a { padding: 10px; display: block; }

    /* Event section */
    .events { max-width: 900px; margin: 30px auto; padding: 20px; }
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* same as book list */
      gap: 20px;
      justify-items: center;
    }
    .event { text-align: center; }
    .event img {
      width: 120px;   /* same width as book list */
      height: 180px;  /* same height as book list */
      object-fit: contain; /* prevent truncation */
      border: 1px solid #ccc;
      background: #eee;
      display: block;
      margin: 0 auto;
    }
    .event-title { margin-top: 6px; font-size: 13px; font-weight: bold; }

    footer { background: #222; color: white; padding: 20px; text-align: center; margin-top: 40px; }
    footer a { color: white; margin: 0 10px; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .social-icons img { height: 20px; margin: 0 5px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="https://i.ytimg.com/vi/wTk-OA6rLK4/hqdefault.jpg" alt="Corporate Logo">
    <h1>Silent Library</h1>
    <input type="text" placeholder="Search">
  </header>

  <!-- Navigation -->
  <nav>
    <ul>

      <li>

      </li>
      <li><a href="event.html">Event</a></li>
      <li>
        <a href="#">About</a>
        <ul>
          <li><a href="contact.html">Contact Us</a></li>

        </ul>
      </li>
    </ul>
  </nav>

  <!-- Events -->
  <section class="events">
    <h2>Upcoming Events</h2>
    <div class="event-grid">
      <div class="event">
        <img src="https://www.press.uillinois.edu/books/images/no_cover_lg.jpg" alt="Event 1">
        <div class="event-title">Event 1</div>
      </div>
      <div class="event">
        <img src="https://www.press.uillinois.edu/books/images/no_cover_lg.jpg" alt="Event 2">
        <div class="event-title">Event 2</div>
      </div>
      <div class="event">
        <img src="https://www.press.uillinois.edu/books/images/no_cover_lg.jpg" alt="Event 3">
        <div class="event-title">Event 3</div>
      </div>
      <div class="event">
        <img src="https://www.press.uillinois.edu/books/images/no_cover_lg.jpg" alt="Event 3">
        <div class="event-title">Event 4</div>
      </div>
      <div class="event">
        <img src="https://www.press.uillinois.edu/books/images/no_cover_lg.jpg" alt="Event 3">
        <div class="event-title">Event 5</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="social-icons">

</body>
